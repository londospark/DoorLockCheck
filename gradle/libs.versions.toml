[versions]
agp = "9.4.0"
kotlin = "2.4.10"
playServicesWearable = "20.0.1"
composeBom = "2026.08.00"
composeMaterial3 = "1.6.2"
composeFoundation = "1.6.2"
composeUiTooling = "1.6.2"
wearToolingPreview = "1.0.0"
activityCompose = "1.13.0"
coreSplashscreen = "1.2.0"
ksp = "2.1.10-1.0.31"
wearWatchface = "1.3.0"

# Testing (JUnit 4 only: AGP's default unit test runner is JUnit 4, and Robolectric
# requires it. Mixing in JUnit 5 without useJUnitPlatform() + vintage engine causes
# jupiter tests to be silently skipped - see AGENTS.md)
junit4 = "4.13.2"
turbine = "1.2.0"
coroutinesTest = "1.10.2"
robolectric = "4.15.1"
androidxTestCore = "1.6.1"
espresso = "3.6.1"

# Core compose artifacts are intentionally versionless: the androidx.compose BOM
# (compose-bom) is applied in the app AND test classpath so both resolve the same
# compose-ui version. A previous revision pinned core compose to 1.6.2, which was
# both wrong (a Wear-Compose version number applied to core Compose) and dead
# config (overridden transitively) - and version drift between app/test compose-ui
# produced NoSuchFieldError crashes in Robolectric.
[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "composeMaterial3" }
compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "composeFoundation" }
compose-ui-tooling = { group = "androidx.wear.compose", name = "compose-ui-tooling", version.ref = "composeUiTooling" }
wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version.ref = "wearToolingPreview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
androidx-wear-watchface-complications = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearWatchface" }

# Testing
junit4core = { group = "junit", name = "junit", version.ref = "junit4" }
turbinelib = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
coroutinestestlib = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
robolectriclib = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidxtestcore = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
espressocorelib = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
