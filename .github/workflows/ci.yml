name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK (includes preview platforms)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Tests and lint (headless via Robolectric - no emulator needed)
        run: ./gradlew check --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK (falls back to debug signing without release secrets)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK (unzipped, installable on a watch via adb install)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Upload release APK (unzipped, installable on a watch via adb install)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
